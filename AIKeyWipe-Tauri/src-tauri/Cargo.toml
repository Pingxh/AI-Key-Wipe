[package]
name = "ai-key-wipe"
version = "1.0.0"
edition = "2021"
description = "AI API Key 隐私清理工具"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
dirs = "5"
rfd = "0.15"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lib]
name = "ai_key_wipe_lib"
crate-type = ["lib", "cdylib", "staticlib"]
