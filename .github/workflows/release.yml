name: 构建发布

on:
  push:
    tags:
      - 'v*'

permissions: write-all

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            bundle: dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: msi
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bundle: deb

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 安装 Linux 依赖
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: 构建
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: AIKeyWipe-Tauri
          tagName: ${{ github.ref_name }}
          releaseName: 'KeyClean v__VERSION__'
          releaseBody: |
            请从下方 Assets 下载对应平台的安装包。

            | 平台 | 安装包 |
            |------|--------|
            | macOS | `KeyClean.dmg` |
            | Windows | `.msi` |
            | Linux | `.deb` |
          releaseDraft: true
          includeDebug: false

      - name: codesign + repack macOS dmg
        if: matrix.os == 'macos-latest'
        run: |
          APP="AIKeyWipe-Tauri/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/KeyClean.app"
          codesign --sign - --force --deep --options runtime "$APP"
          codesign --verify --verbose "$APP"
          echo "repaking signed app into new dmg..."
          D="${APP%/*.app}"
          hdiutil create -volname "KeyClean" -srcfolder "$D" -ov -format UDZO "${D}_signed.dmg"
          mv "${D}_signed.dmg" "${D}.dmg"
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: upload signed dmg to release
        if: matrix.os == 'macos-latest'
        run: |
          ASSET="AIKeyWipe-Tauri/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/KeyClean.dmg"
          gh release upload ${{ github.ref_name }} "$ASSET" --clobber
