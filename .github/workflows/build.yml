name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: dmg
            name: macOS
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: AppImage
            name: Linux
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: msi
            name: Windows

    runs-on: ${{ matrix.os }}
    outputs:
      artifact: AI-Key-Wipe-${{ matrix.name }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libssl-dev libayatana-appindicator3-dev

      - name: Build
        run: cargo tauri build
        working-directory: AIKeyWipe-Tauri

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Key-Wipe-${{ matrix.name }}
          path: |
            AIKeyWipe-Tauri/src-tauri/target/release/bundle/**/*

  release:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: List files
        run: find . -type f | head -30

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: AI-Key-Wipe ${{ github.ref_name }}
          body: |
            ## AI-Key-Wipe ${{ github.ref_name }}
            
            ### 下载
            - **macOS**: AI-Key-Wipe-macOS 目录下的 .dmg 文件
            - **Windows**: AI-Key-Wipe-Windows 目录下的 .msi 文件
            - **Linux**: AI-Key-Wipe-Linux 目录下的 .AppImage 文件
            
            ### 功能
            - AI API Key 扫描与清除
            - 跨平台支持（macOS / Windows / Linux）
            - 系统托盘与 Dock 显隐
            - 自定义匹配模式
          files: |
            AI-Key-Wipe-macOS/**/*
            AI-Key-Wipe-Windows/**/*
            AI-Key-Wipe-Linux/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
